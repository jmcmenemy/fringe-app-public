<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%23a855f7%27/%3E%3Ctext%20x%3D%2732%27%20y%3D%2736%27%20font-size%3D%2736%27%20text-anchor%3D%27middle%27%20dominant-baseline%3D%27central%27%3E%F0%9F%8E%AD%3C/text%3E%3C/svg%3E"/>
<title>Fringe 2026 · Plan your shows (API demo)</title>
<style>
  :root{ --bg:#0d0b1a; --card:#17142b; --border:#2b2745; --txt:#f1f0f7; --txt2:#b7b3cf; --txt3:#7c789a; --accent:#a855f7; --pink:#ec4899; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--txt); font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  a{ color:#60a5fa; }
  input[type=range]{ accent-color:var(--accent); }
  ::-webkit-scrollbar{ width:10px;height:10px; } ::-webkit-scrollbar-thumb{ background:#2b2745;border-radius:6px; }
  .spin{ width:34px;height:34px;border:3px solid #2b2745;border-top-color:var(--accent);border-radius:50%;animation:s 0.8s linear infinite;margin:60px auto; } @keyframes s{ to{ transform:rotate(360deg);} }

/* theme */
:root{--bg:#0d0b1a;--card:#17142b;--border:#2b2745;--txt:#f1f0f7;--txt2:#b7b3cf;--txt3:#7c789a;--accent:#a855f7;--pink:#ec4899;}
html[data-theme="light"]{--bg:#f6f5fb;--card:#ffffff;--border:#e3e1ee;--txt:#1a1730;--txt2:#4a4763;--txt3:#8b88a3;--accent:#7c3aed;--pink:#db2777;}
html[data-theme="nocolor"]{--bg:#0e0e12;--card:#1b1b22;--border:#33333f;--txt:#ededf2;--txt2:#b0b0bc;--txt3:#7a7a86;--accent:#8a8a95;--pink:#8a8a95;}
body{background:var(--bg);color:var(--txt);}
select,option{color:var(--txt);}
option{background:var(--card);color:var(--txt);}
html[data-theme="nocolor"] #root{filter:grayscale(1);}
/* end theme */
</style>
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("fringe-public-theme")||"dark");}catch(e){}</script>
</head>
